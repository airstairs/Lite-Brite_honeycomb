<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightBrite Honeycomb</title>

    <style>
        /* Base Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #080810;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(236, 72, 153, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.12), transparent 40%);
            color: #e2e8f0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
        }

        .font-orbitron {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }

        /* Fullscreen Cabinet Frame */
        .arcade-frame {
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.9),
                inset 0 0 15px rgba(255, 255, 255, 0.04),
                0 0 0 2px rgba(255, 255, 255, 0.08),
                0 0 25px rgba(236, 72, 153, 0.15);
            background: linear-gradient(to bottom, #0f172a, #020617, #000000);
            padding: 8px;
            border-radius: 20px;
            border: 3px solid rgba(30, 41, 59, 0.8);
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 4px auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: #1e293b;
            border-radius: 6px;
            height: 6px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 8px #06b6d4;
        }

        /* Flash Overlay */
        #flashOverlay {
            pointer-events: none;
            transition: opacity 0.4s ease-out;
            position: absolute;
            inset: 0;
            background-color: #ffffff;
            opacity: 0;
            border-radius: 12px;
        }

        /* Layout Utility Classes */
        .header-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px;
        }

        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar-section {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 8px 12px;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.03);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-slate {
            background-color: #1e293b;
            border-color: #334155;
            color: #cbd5e1;
        }
        .btn-slate:hover {
            background-color: #334155;
            color: #ffffff;
        }

        .btn-gradient-pink {
            background: linear-gradient(to right, #e11d48, #f43f5e);
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(225, 29, 72, 0.4);
        }

        .btn-gradient-clear {
            background: linear-gradient(to right, #dc2626, #e11d48, #ec4899);
            color: #ffffff;
            font-weight: 800;
            border: 1px solid rgba(251, 113, 133, 0.3);
            box-shadow: 0 3px 10px rgba(225, 29, 72, 0.4);
        }

        .svg-icon {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .gradient-text {
            background: linear-gradient(to right, #f43f5e, #67e8f9, #fde047);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        select {
            background-color: #020617;
            border: 1px solid #334155;
            font-size: 11px;
            color: #67e8f9;
            font-weight: 500;
            border-radius: 10px;
            padding: 6px 10px;
            outline: none;
            cursor: pointer;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 5px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover, .icon-btn.active-shape {
            color: #22d3ee;
            background-color: #1e293b;
        }

        .size-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }
        .size-btn.active-size {
            background-color: #0891b2;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Top Branding & Status Header -->
    <header class="header-container">
        <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(to top right, #ec4899, #a855f7, #22d3ee); padding: 2px; display: flex; align-items: center; justify-content: center;">
                <div style="width: 100%; height: 100%; background-color: #020617; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <svg class="svg-icon" style="color: #f43f5e; width: 16px; height: 16px;" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/></svg>
                </div>
            </div>
            <div>
                <h1 class="font-orbitron gradient-text" style="font-size: 16px; margin: 0;">
                    LightBrite<span style="color: #ffffff;">HONEYCOMB</span>
                </h1>
            </div>
        </div>

        <!-- Audio & FX Toggles -->
        <div style="display: flex; align-items: center; gap: 6px;">
            <button id="soundToggleBtn" class="btn btn-slate" style="border-radius: 9999px; padding: 4px 10px;">
                <svg id="soundIcon" class="svg-icon" style="color: #22d3ee;" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <span id="soundLabel" style="color: #cbd5e1; font-weight: 600; font-size: 10px;">Sound ON</span>
            </button>
            <button id="glowPulseBtn" class="btn btn-slate" style="border-radius: 9999px; padding: 4px 10px;">
                <svg class="svg-icon" style="color: #facc15;" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                <span style="color: #cbd5e1; font-weight: 600; font-size: 10px;">Pulse</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="main-container">

        <!-- Top Tools & Color Swatches Bar -->
        <section class="toolbar-section">
            <div style="display: flex; align-items: center; gap: 6px;">
                <button id="toolDrawBtn" title="Draw Mode" class="btn btn-gradient-pink">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    <span>Pen</span>
                </button>
                <button id="toolEraseBtn" title="Erase Mode" class="btn btn-slate">
                    <svg class="svg-icon" style="color: #f43f5e;" viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83L7.03 22h13.97v-2H11.88l9.43-9.43c.78-.78.78-2.05 0-2.83l-4.76-4.75c-.39-.39-.9-.59-1.41-.59z"/></svg>
                    <span>Erase</span>
                </button>
                <button id="topClearBtn" class="btn btn-gradient-clear" title="Clear All Pegs">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    <span>Clear All</span>
                </button>
            </div>

            <!-- Neon Color Swatches -->
            <div id="colorPalette" style="display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 2px 6px; background-color: rgba(2, 6, 23, 0.6); border-radius: 10px; border: 1px solid rgba(30, 41, 59, 0.8);">
            </div>

            <!-- Size & Shape Selectors -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="display: flex; align-items: center; background-color: rgba(2, 6, 23, 0.8); border-radius: 10px; padding: 2px; border: 1px solid #1e293b;">
                    <button data-size="1" class="size-btn">S</button>
                    <button data-size="2" class="size-btn active-size">M</button>
                    <button data-size="3" class="size-btn">L</button>
                </div>

                <div style="display: flex; align-items: center; gap: 2px; background-color: rgba(2, 6, 23, 0.8); border-radius: 10px; padding: 2px; border: 1px solid #1e293b;">
                    <button data-shape="circle" class="icon-btn active-shape" title="Circle"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
                    <button data-shape="square" class="icon-btn" title="Square"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg></button>
                    <button data-shape="star" class="icon-btn" title="Star"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
                    <button data-shape="diamond" class="icon-btn" title="Diamond"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg></button>
                    <button data-shape="heart" class="icon-btn" title="Heart"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
                </div>
            </div>
        </section>

        <!-- Fullscreen Canvas Board Frame -->
        <div class="arcade-frame">
            <div style="position: relative; background-color: #020617; border-radius: 12px; padding: 2px; border: 1px solid #1e293b; display: flex; justify-content: center; align-items: center; flex: 1; overflow: hidden; width: 100%;">
                <canvas id="pegCanvas" style="cursor: crosshair; border-radius: 10px; display: block; touch-action: none; width: 100%; height: 100%; object-fit: contain;"></canvas>
                <div id="flashOverlay"></div>
            </div>

            <!-- Glow Intensity Slider & Stats Bar -->
            <div style="margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 0 4px; gap: 6px; font-size: 11px; color: #94a3b8;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <svg class="svg-icon" style="color: #eab308;" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
                    <span>Glow:</span>
                    <input id="glowSlider" type="range" min="0" max="30" value="18" style="width: 90px; cursor: pointer;">
                </div>
                <div>
                    <span id="pegCounter" style="background-color: #0f172a; padding: 2px 8px; border-radius: 6px; border: 1px solid #1e293b; color: #cbd5e1; font-family: monospace;">
                        Pegs: <span style="color: #f43f5e; font-weight: bold;">0</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Bottom Actions & Controls -->
        <section class="toolbar-section">
            <div style="display: flex; align-items: center; gap: 6px;">
                <svg class="svg-icon" style="color: #c084fc;" viewBox="0 0 24 24"><path d="M7.5 5.6L5 7l1.4-2.5L5 2l2.5 1.4L10 2 8.6 4.5 10 7 7.5 5.6zm12 9.8l-2.5 1.4 1.4-2.5L17 12l2.5 1.4 2.5-1.4-1.4 2.5 1.4 2.5-2.5-1.4zM22 2l-2.5 1.4L17 2l1.4 2.5L17 7l2.5-1.4L22 7l-1.4-2.5L22 2zM14.37 7.29c-.39-.39-1.02-.39-1.41 0L1.29 18.96c-.39.39-.39 1.02 0 1.41l2.34 2.34c.39.39 1.02.39 1.41 0L16.7 11.04c.39-.39.39-1.02 0-1.41l-2.33-2.34z"/></svg>
                <select id="templateSelect">
                    <option value="blank">-- Canvas Templates --</option>
                    <option value="heart">Simple Heart</option>
                    <option value="smile">Smiley Face</option>
                    <option value="rocket">Retro Rocket</option>
                    <option value="star">Glowing Star</option>
                    <option value="butterfly">Neon Butterfly</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 2px; background-color: rgba(2, 6, 23, 0.8); padding: 2px; border-radius: 10px; border: 1px solid #1e293b;">
                    <button id="undoBtn" class="btn btn-slate" style="padding: 5px 8px;" title="Undo"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
                    <button id="redoBtn" class="btn btn-slate" style="padding: 5px 8px;" title="Redo"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></button>
                </div>

                <button id="saveBtn" class="btn btn-slate" style="color: #67e8f9;">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    <span>Export</span>
                </button>

                <button id="clearBtn" class="btn btn-gradient-clear">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                    <span>CLEAR</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Offline App JavaScript with Performance Optimizations -->
    <script>
        const NEON_COLORS = [
            { name: 'Pink', hex: '#ff2a85', glow: '#ff0066' },
            { name: 'Cyan', hex: '#00f0ff', glow: '#00b7ff' },
            { name: 'Lime Green', hex: '#39ff14', glow: '#22cc00' },
            { name: 'Yellow', hex: '#ffe600', glow: '#ffaa00' },
            { name: 'Purple', hex: '#b026ff', glow: '#8800ff' },
            { name: 'Orange', hex: '#ff5e00', glow: '#ff3300' },
            { name: 'Magenta', hex: '#ff00a0', glow: '#cc0080' },
            { name: 'Blue', hex: '#2979ff', glow: '#0040ff' },
            { name: 'White', hex: '#ffffff', glow: '#d4f1f9' }
        ];

        const GRID_ROWS = 32;
        const GRID_COLS = 56;
        const STORAGE_KEY = 'neon_brite_saved_board_v1';

        let state = {
            grid: Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(null)),
            currentColor: NEON_COLORS[0],
            currentSize: 1,
            currentShape: 'circle',
            isEraser: false,
            glowIntensity: 18,
            pulseFX: true,
            soundEnabled: true,
            isDrawing: false,
            lastHoverGridPos: null,
            history: [],
            historyIndex: -1
        };

        let audioCtx = null;
        let lastSoundTime = 0; // Throttle sound during continuous fast drag

        // Pre-rendered offscreen background canvas for high performance
        let bgCanvas = document.createElement('canvas');
        let bgCtx = bgCanvas.getContext('2d');

        function playRetroSound(type) {
            if (!state.soundEnabled) return;

            const nowTime = performance.now();
            // Throttle rapid sounds during drag/drawing (minimum 45ms spacing)
            if (type === 'pop' || type === 'erase') {
                if (nowTime - lastSoundTime < 45) return;
                lastSoundTime = nowTime;
            }

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300 + Math.random() * 200, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'erase') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'clear') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.warn('Audio play error:', e);
            }
        }

        const canvas = document.getElementById('pegCanvas');
        const ctx = canvas.getContext('2d');
        const colorPalette = document.getElementById('colorPalette');
        const glowSlider = document.getElementById('glowSlider');
        const glowPulseBtn = document.getElementById('glowPulseBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundLabel = document.getElementById('soundLabel');
        const toolDrawBtn = document.getElementById('toolDrawBtn');
        const toolEraseBtn = document.getElementById('toolEraseBtn');
        const topClearBtn = document.getElementById('topClearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const templateSelect = document.getElementById('templateSelect');
        const flashOverlay = document.getElementById('flashOverlay');
        const pegCounter = document.getElementById('pegCounter').querySelector('span');

        let cellWidth = 16;
        let cellHeight = 16;

        function initApp() {
            setupColorPalette();
            setupEventListeners();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Load board state
            loadBoardFromStorage();
            
            requestAnimationFrame(renderLoop);
        }

        function saveBoardToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.grid));
            } catch (e) {
                console.warn('Failed to save to localStorage:', e);
            }
        }

        function loadBoardFromStorage() {
            try {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    const parsedGrid = JSON.parse(savedData);
                    if (Array.isArray(parsedGrid) && parsedGrid.length === GRID_ROWS) {
                        state.grid = parsedGrid;
                    }
                }
            } catch (e) {
                console.warn('Failed to load from localStorage:', e);
            }
            saveStateToHistory();
        }

        function setupColorPalette() {
            colorPalette.innerHTML = '';
            NEON_COLORS.forEach((color, idx) => {
                const btn = document.createElement('button');
                btn.style.width = '24px';
                btn.style.height = '24px';
                btn.style.borderRadius = '50%';
                btn.style.border = idx === 0 ? '2px solid #ffffff' : '2px solid transparent';
                btn.style.backgroundColor = color.hex;
                btn.style.boxShadow = `0 0 8px ${color.glow}`;
                btn.style.cursor = 'pointer';
                btn.style.transition = 'transform 0.2s ease';
                btn.title = color.name;
                
                btn.addEventListener('click', () => {
                    state.currentColor = color;
                    state.isEraser = false;
                    updateToolUI();
                    document.querySelectorAll('#colorPalette button').forEach(b => {
                        b.style.border = '2px solid transparent';
                    });
                    btn.style.border = '2px solid #ffffff';
                    playRetroSound('pop');
                });
                colorPalette.appendChild(btn);
            });
        }

        // Render static grid background offscreen for high frame rates
        function preRenderBackground(width, height) {
            bgCanvas.width = canvas.width;
            bgCanvas.height = canvas.height;

            bgCtx.fillStyle = '#05070e';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            const scale = Math.min(window.devicePixelRatio || 1, 1.5);
            const holeRadius = Math.min(cellWidth, cellHeight) * 0.22 * scale;

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const cx = (c * cellWidth + cellWidth / 2) * scale;
                    const cy = (r * cellHeight + cellHeight / 2) * scale;

                    bgCtx.beginPath();
                    bgCtx.arc(cx, cy, holeRadius, 0, Math.PI * 2);
                    bgCtx.fillStyle = '#0b0f19';
                    bgCtx.fill();
                    
                    bgCtx.strokeStyle = '#1e293b';
                    bgCtx.lineWidth = 1 * scale;
                    bgCtx.stroke();
                }
            }
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            // Limit DPR on budget hardware to cap resolution load
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            canvas.width = width * dpr;
            canvas.height = height * dpr;

            cellWidth = width / GRID_COLS;
            cellHeight = height / GRID_ROWS;

            preRenderBackground(width, height);
        }

        function renderLoop(timestamp) {
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            const width = canvas.width / dpr;
            const height = canvas.height / dpr;

            ctx.save();
            ctx.scale(dpr, dpr);

            // Fast blit of cached background grid
            ctx.drawImage(bgCanvas, 0, 0, width, height);

            let pulse = 1.0;
            if (state.pulseFX) {
                pulse = 0.85 + Math.sin(timestamp / 300) * 0.15;
            }

            let count = 0;

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const peg = state.grid[r][c];
                    if (peg) {
                        count++;
                        const cx = c * cellWidth + cellWidth / 2;
                        const cy = r * cellHeight + cellHeight / 2;
                        drawPegShape(ctx, cx, cy, peg, pulse);
                    }
                }
            }

            ctx.restore();

            pegCounter.textContent = count;
            requestAnimationFrame(renderLoop);
        }

        function drawPegShape(context, cx, cy, peg, pulse) {
            const baseSize = Math.min(cellWidth, cellHeight) * 0.38 * (peg.size || 1);
            const glowVal = (state.glowIntensity * pulse);

            context.save();
            
            // Dynamic shadow blur optimization
            if (glowVal > 0) {
                context.shadowColor = peg.color.glow;
                context.shadowBlur = glowVal;
            }
            context.fillStyle = peg.color.hex;
            context.strokeStyle = '#ffffff';
            context.lineWidth = 0.8;

            const shape = peg.shape || 'circle';

            context.beginPath();
            if (shape === 'circle') {
                context.arc(cx, cy, baseSize, 0, Math.PI * 2);
            } else if (shape === 'square') {
                context.rect(cx - baseSize, cy - baseSize, baseSize * 2, baseSize * 2);
            } else if (shape === 'star') {
                drawStarPath(context, cx, cy, 5, baseSize * 1.2, baseSize * 0.5);
            } else if (shape === 'diamond') {
                context.moveTo(cx, cy - baseSize * 1.2);
                context.lineTo(cx + baseSize * 1.1, cy);
                context.lineTo(cx, cy + baseSize * 1.2);
                context.lineTo(cx - baseSize * 1.1, cy);
                context.closePath();
            } else if (shape === 'heart') {
                drawHeartPath(context, cx, cy, baseSize * 1.1);
            }

            context.fill();
            context.stroke();

            // Peg highlight specular dot
            context.beginPath();
            context.arc(cx - baseSize * 0.25, cy - baseSize * 0.25, baseSize * 0.3, 0, Math.PI * 2);
            context.fillStyle = 'rgba(255, 255, 255, 0.6)';
            context.fill();

            context.restore();
        }

        function drawStarPath(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }

        function drawHeartPath(ctx, cx, cy, size) {
            ctx.moveTo(cx, cy + size * 0.6);
            ctx.bezierCurveTo(cx, cy + size * 0.2, cx - size, cy - size * 0.2, cx - size * 0.6, cy - size * 0.6);
            ctx.bezierCurveTo(cx - size * 0.2, cy - size, cx, cy - size * 0.4, cx, cy - size * 0.3);
            ctx.bezierCurveTo(cx, cy - size * 0.4, cx + size * 0.2, cy - size, cx + size * 0.6, cy - size * 0.6);
            ctx.bezierCurveTo(cx + size, cy - size * 0.2, cx, cy + size * 0.2, cx, cy + size * 0.6);
            ctx.closePath();
        }

        function setupEventListeners() {
            canvas.addEventListener('pointerdown', handlePointerDown);
            canvas.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
            window.addEventListener('pointercancel', handlePointerUp);

            toolDrawBtn.addEventListener('click', () => {
                state.isEraser = false;
                updateToolUI();
                playRetroSound('pop');
            });
            toolEraseBtn.addEventListener('click', () => {
                state.isEraser = true;
                updateToolUI();
                playRetroSound('erase');
            });

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-size'));
                    btn.classList.add('active-size');
                    state.currentSize = parseInt(btn.dataset.size);
                    playRetroSound('pop');
                });
            });

            document.querySelectorAll('.icon-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active-shape'));
                    btn.classList.add('active-shape');
                    state.currentShape = btn.dataset.shape;
                    playRetroSound('pop');
                });
            });

            glowSlider.addEventListener('input', (e) => {
                state.glowIntensity = parseInt(e.target.value);
            });

            glowPulseBtn.addEventListener('click', () => {
                state.pulseFX = !state.pulseFX;
                glowPulseBtn.style.opacity = state.pulseFX ? '1' : '0.5';
                playRetroSound('pop');
            });

            soundToggleBtn.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                soundLabel.textContent = state.soundEnabled ? 'Sound ON' : 'Sound OFF';
            });

            clearBtn.addEventListener('click', clearBoardWithFX);
            topClearBtn.addEventListener('click', clearBoardWithFX);
            undoBtn.addEventListener('click', undo);
            redoBtn.addEventListener('click', redo);

            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    undo();
                } else if (e.ctrlKey && e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
            });

            saveBtn.addEventListener('click', exportImage);
            templateSelect.addEventListener('change', (e) => {
                loadTemplate(e.target.value);
                e.target.value = 'blank';
            });
        }

        function updateToolUI() {
            if (state.isEraser) {
                toolEraseBtn.className = 'btn btn-gradient-pink';
                toolDrawBtn.className = 'btn btn-slate';
            } else {
                toolDrawBtn.className = 'btn btn-gradient-pink';
                toolEraseBtn.className = 'btn btn-slate';
            }
        }

        function getGridPosFromPointer(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const c = Math.floor(x / (rect.width / GRID_COLS));
            const r = Math.floor(y / (rect.height / GRID_ROWS));

            if (r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS) {
                return { r, c };
            }
            return null;
        }

        // Fast line rasterization (Bresenham's algorithm) to guarantee smooth continuous lines during fast swipes on budget hardware
        function interpolateLine(r0, c0, r1, c1) {
            const points = [];
            let dr = Math.abs(r1 - r0);
            let dc = Math.abs(c1 - c0);
            let sr = r0 < r1 ? 1 : -1;
            let sc = c0 < c1 ? 1 : -1;
            let err = dr - dc;

            let currR = r0;
            let currC = c0;

            while (true) {
                points.push({ r: currR, c: currC });
                if (currR === r1 && currC === c1) break;
                let e2 = 2 * err;
                if (e2 > -dc) {
                    err -= dc;
                    currR += sr;
                }
                if (e2 < dr) {
                    err += dr;
                    currC += sc;
                }
            }
            return points;
        }

        function handlePointerDown(e) {
            state.isDrawing = true;
            try {
                canvas.setPointerCapture(e.pointerId);
            } catch(err) {}

            const pos = getGridPosFromPointer(e);
            if (pos) {
                applyToolAt(pos.r, pos.c);
                state.lastHoverGridPos = pos;
            }
        }

        function handlePointerMove(e) {
            if (!state.isDrawing) return;
            const pos = getGridPosFromPointer(e);
            if (pos) {
                if (!state.lastHoverGridPos) {
                    applyToolAt(pos.r, pos.c);
                    state.lastHoverGridPos = pos;
                } else if (pos.r !== state.lastHoverGridPos.r || pos.c !== state.lastHoverGridPos.c) {
                    // Line interpolation fills in gaps during rapid gestures
                    const path = interpolateLine(state.lastHoverGridPos.r, state.lastHoverGridPos.c, pos.r, pos.c);
                    path.forEach(pt => applyToolAt(pt.r, pt.c));
                    state.lastHoverGridPos = pos;
                }
            }
        }

        function handlePointerUp(e) {
            if (state.isDrawing) {
                state.isDrawing = false;
                state.lastHoverGridPos = null;
                saveStateToHistory();
                saveBoardToStorage();
            }
        }

        function applyToolAt(r, c) {
            if (state.isEraser) {
                if (state.grid[r][c] !== null) {
                    state.grid[r][c] = null;
                    playRetroSound('erase');
                }
            } else {
                state.grid[r][c] = {
                    color: state.currentColor,
                    size: state.currentSize,
                    shape: state.currentShape
                };
                playRetroSound('pop');
            }
        }

        function saveStateToHistory() {
            state.history = state.history.slice(0, state.historyIndex + 1);
            const gridCopy = state.grid.map(row => row.map(cell => cell ? { ...cell } : null));
            state.history.push(gridCopy);
            state.historyIndex = state.history.length - 1;
            updateUndoRedoUI();
        }

        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                restoreHistoryState();
                playRetroSound('erase');
                saveBoardToStorage();
            }
        }

        function redo() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                restoreHistoryState();
                playRetroSound('pop');
                saveBoardToStorage();
            }
        }

        function restoreHistoryState() {
            const savedGrid = state.history[state.historyIndex];
            state.grid = savedGrid.map(row => row.map(cell => cell ? { ...cell } : null));
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            undoBtn.style.opacity = state.historyIndex <= 0 ? '0.3' : '1';
            redoBtn.style.opacity = state.historyIndex >= state.history.length - 1 ? '0.3' : '1';
        }

        function clearBoardWithFX() {
            playRetroSound('clear');
            flashOverlay.style.opacity = '0.9';
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
            }, 250);

            state.grid = Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(null));
            saveStateToHistory();
            saveBoardToStorage();
        }

        function exportImage() {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = 1600;
            exportCanvas.height = 900;
            const expCtx = exportCanvas.getContext('2d');

            expCtx.fillStyle = '#05070e';
            expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            const expCellW = exportCanvas.width / GRID_COLS;
            const expCellH = exportCanvas.height / GRID_ROWS;

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const cx = c * expCellW + expCellW / 2;
                    const cy = r * expCellH + expCellH / 2;
                    const peg = state.grid[r][c];

                    if (!peg) {
                        expCtx.beginPath();
                        expCtx.arc(cx, cy, expCellW * 0.22, 0, Math.PI * 2);
                        expCtx.fillStyle = '#0b0f19';
                        expCtx.fill();
                    } else {
                        drawPegShape(expCtx, cx, cy, peg, 1.0);
                    }
                }
            }

            const link = document.createElement('a');
            link.download = `neon-brite-artwork-${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        function loadTemplate(name) {
            if (name === 'blank') {
                clearBoardWithFX();
                return;
            }

            state.grid = Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(null));

            const pink = NEON_COLORS[0];
            const cyan = NEON_COLORS[1];
            const yellow = NEON_COLORS[3];
            const magenta = NEON_COLORS[6];
            const white = NEON_COLORS[8];

            if (name === 'heart') {
                const heartPoints = [
                    {r: 10, c: 25, color: pink}, {r: 10, c: 26, color: pink}, {r: 10, c: 29, color: pink}, {r: 10, c: 30, color: pink},
                    {r: 9, c: 24, color: pink}, {r: 9, c: 27, color: pink}, {r: 9, c: 28, color: pink}, {r: 9, c: 31, color: pink},
                    {r: 11, c: 23, color: pink}, {r: 12, c: 22, color: pink}, {r: 13, c: 22, color: pink},
                    {r: 11, c: 32, color: pink}, {r: 12, c: 33, color: pink}, {r: 13, c: 33, color: pink},
                    {r: 14, c: 23, color: pink}, {r: 15, c: 24, color: pink}, {r: 16, c: 25, color: pink},
                    {r: 17, c: 26, color: pink}, {r: 18, c: 27, color: pink}, {r: 19, c: 27, color: pink},
                    {r: 14, c: 32, color: pink}, {r: 15, c: 31, color: pink}, {r: 16, c: 30, color: pink},
                    {r: 17, c: 29, color: pink}, {r: 18, c: 28, color: pink}
                ];
                heartPoints.forEach(p => {
                    state.grid[p.r][p.c] = { color: p.color, size: 2, shape: 'circle' };
                });
            } else if (name === 'smile') {
                state.grid[11][23] = { color: cyan, size: 2, shape: 'circle' };
                state.grid[11][32] = { color: cyan, size: 2, shape: 'circle' };
                const mouth = [
                    {r: 17, c: 22}, {r: 18, c: 23}, {r: 19, c: 24}, {r: 19, c: 25}, {r: 19, c: 26},
                    {r: 19, c: 27}, {r: 19, c: 28}, {r: 19, c: 29}, {r: 19, c: 30}, {r: 18, c: 31}, {r: 17, c: 32}
                ];
                mouth.forEach(p => {
                    state.grid[p.r][p.c] = { color: yellow, size: 2, shape: 'circle' };
                });
            } else if (name === 'star') {
                const starPoints = [
                    {r: 6, c: 27}, {r: 7, c: 27}, {r: 8, c: 27},
                    {r: 9, c: 26}, {r: 9, c: 27}, {r: 9, c: 28},
                    {r: 10, c: 21}, {r: 10, c: 22}, {r: 10, c: 23}, {r: 10, c: 24}, {r: 10, c: 25}, {r: 10, c: 26}, {r: 10, c: 27}, {r: 10, c: 28}, {r: 10, c: 29}, {r: 10, c: 30}, {r: 10, c: 31}, {r: 10, c: 32}, {r: 10, c: 33},
                    {r: 11, c: 24}, {r: 11, c: 25}, {r: 11, c: 26}, {r: 11, c: 27}, {r: 11, c: 28}, {r: 11, c: 29}, {r: 11, c: 30},
                    {r: 12, c: 25}, {r: 12, c: 27}, {r: 12, c: 29},
                    {r: 13, c: 24}, {r: 13, c: 27}, {r: 13, c: 30},
                    {r: 14, c: 23}, {r: 14, c: 31}
                ];
                starPoints.forEach(p => {
                    state.grid[p.r][p.c] = { color: yellow, size: 2, shape: 'star' };
                });
            } else if (name === 'rocket') {
                const body = [
                    {r: 8, c: 27, col: white}, {r: 9, c: 26, col: pink}, {r: 9, c: 27, col: white}, {r: 9, c: 28, col: pink},
                    {r: 10, c: 26, col: white}, {r: 10, c: 27, col: cyan}, {r: 10, c: 28, col: white},
                    {r: 11, c: 26, col: white}, {r: 11, c: 27, col: cyan}, {r: 11, c: 28, col: white},
                    {r: 12, c: 25, col: pink}, {r: 12, c: 26, col: white}, {r: 12, c: 27, col: white}, {r: 12, c: 28, col: white}, {r: 12, c: 29, col: pink},
                    {r: 13, c: 24, col: pink}, {r: 13, c: 27, col: yellow}, {r: 13, c: 30, col: pink},
                    {r: 14, c: 26, col: yellow}, {r: 14, c: 27, col: yellow}, {r: 14, c: 28, col: yellow},
                    {r: 15, c: 27, col: yellow}
                ];
                body.forEach(p => {
                    state.grid[p.r][p.c] = { color: p.col, size: 2, shape: 'circle' };
                });
            } else if (name === 'butterfly') {
                const wings = [
                    {r: 12, c: 27, col: white}, {r: 13, c: 27, col: white}, {r: 14, c: 27, col: white}, {r: 15, c: 27, col: white},
                    {r: 10, c: 24, col: magenta}, {r: 10, c: 25, col: magenta}, {r: 11, c: 22, col: magenta}, {r: 11, c: 23, col: cyan}, {r: 11, c: 26, col: magenta},
                    {r: 12, c: 21, col: magenta}, {r: 12, c: 23, col: cyan}, {r: 12, c: 24, col: cyan}, {r: 13, c: 22, col: magenta}, {r: 13, c: 25, col: magenta},
                    {r: 10, c: 29, col: magenta}, {r: 10, c: 30, col: magenta}, {r: 11, c: 32, col: magenta}, {r: 11, c: 31, col: cyan}, {r: 11, c: 28, col: magenta},
                    {r: 12, c: 33, col: magenta}, {r: 12, c: 31, col: cyan}, {r: 12, c: 30, col: cyan}, {r: 13, c: 32, col: magenta}, {r: 13, c: 29, col: magenta}
                ];
                wings.forEach(p => {
                    state.grid[p.r][p.c] = { color: p.col, size: 2, shape: 'diamond' };
                });
            }

            playRetroSound('clear');
            saveStateToHistory();
            saveBoardToStorage();
        }

        window.onload = initApp;
    </script>
