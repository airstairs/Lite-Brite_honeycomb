<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Holo Honeycomb Grid - Bright Light Mode & Eraser</title>
    <style>
        :root {
            --bg-color: #080b10;
            --ui-bg: rgba(15, 20, 30, 0.85);
            --ui-text: #f0f4f8;
            --btn-bg: rgba(20, 28, 42, 0.9);
            --btn-border: rgba(240, 244, 248, 0.3);
            --dropdown-bg: rgba(15, 22, 34, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            touch-action: none;
            font-family: sans-serif;
            transition: background-color 0.3s ease;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--ui-text);
            background: var(--ui-bg);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--btn-border);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .ui-btn {
            position: absolute;
            top: 15px;
            color: var(--ui-text);
            background: var(--btn-bg);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid var(--btn-border);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
            transition: background 0.2s, transform 0.1s;
        }
        .ui-btn:active {
            transform: scale(0.95);
        }
        #clear-btn {
            left: 15px;
        }
        #color-btn {
            left: 85px;
        }
        #color-dropdown {
            position: absolute;
            top: 55px;
            left: 85px;
            background: var(--dropdown-bg);
            border: 1px solid var(--btn-border);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            display: none;
            flex-direction: column;
            z-index: 20;
            overflow: hidden;
            min-width: 170px;
        }
        .dropdown-item {
            padding: 10px 14px;
            color: var(--ui-text);
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            border-bottom: 1px solid rgba(128, 128, 128, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }
        .dropdown-item:hover, .dropdown-item:active {
            background: rgba(128, 128, 128, 0.2);
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 6px currentColor;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">SWIPE TO DRAW LIGHTS</div>
    <div id="clear-btn" class="ui-btn">CLEAR</div>
    <div id="color-btn" class="ui-btn">🎨 COLOR</div>

    <div id="color-dropdown">
        <div class="dropdown-item" data-mode="sequence" style="border-bottom: 1px solid rgba(128,128,128,0.3);">
            <span>⚡ Sequence Mode</span>
        </div>
        <div class="dropdown-item" data-mode="eraser" style="border-bottom: 1px solid rgba(128,128,128,0.3);">
            <span>🧹 Eraser Mode</span>
        </div>
        <div class="dropdown-item" data-index="1"><div class="color-dot" style="background:#ff1a45; color:#ff1a45;"></div>Red</div>
        <div class="dropdown-item" data-index="2"><div class="color-dot" style="background:#00f0ff; color:#00f0ff;"></div>Blue</div>
        <div class="dropdown-item" data-index="3"><div class="color-dot" style="background:#ffea00; color:#ffea00;"></div>Yellow</div>
        <div class="dropdown-item" data-index="4"><div class="color-dot" style="background:#ff6600; color:#ff6600;"></div>Orange</div>
        <div class="dropdown-item" data-index="5"><div class="color-dot" style="background:#b000ff; color:#b000ff;"></div>Purple</div>
        <div class="dropdown-item" data-index="6"><div class="color-dot" style="background:#00ff66; color:#00ff66;"></div>Green</div>
        <div class="dropdown-item" data-index="7"><div class="color-dot" style="background:#ff00bb; color:#ff00bb;"></div>Pink</div>
    </div>

    <!-- Include local Three.js minified file -->
    <script src="three.min.js"></script>
    <script>
        initApp();

        function initApp() {
            const scene = new THREE.Scene();
            
            const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');
            let isDarkMode = darkModeQuery.matches;

            scene.fog = new THREE.FogExp2(isDarkMode ? 0x080b10 : 0xf2f5fa, 0.015);

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, -10.5, 15);
            camera.rotation.x = Math.PI / 6; 

            const renderer = new THREE.WebGLRenderer({ 
                antialias: false,
                powerPreference: "high-performance",
                precision: "mediump" 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, isDarkMode ? 0.8 : 1.2);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, isDarkMode ? 1.0 : 0.9);
            keyLight.position.set(5, -15, 20);
            scene.add(keyLight);

            const HEX_SIZE = 0.48; 
            const HEX_WIDTH = HEX_SIZE * 2;
            const HEX_HEIGHT = Math.sqrt(3) * HEX_SIZE;
            
            const neonColors = [
                null,                  // 0: Off
                0xff1a45,              // 1: Red
                0x00f0ff,              // 2: Blue
                0xffea00,              // 3: Yellow
                0xff6600,              // 4: Orange
                0xb000ff,              // 5: Purple
                0x00ff66,              // 6: Green
                0xff00bb,              // 7: Pink
                null,                  // 8: Off
                null                   // 9: Off
            ];

            let hexMeshes = new Map(); 
            let raycastTargets = [];
            let fallingDebris = [];
            
            let savedData = {};
            try {
                savedData = JSON.parse(localStorage.getItem('holo_honeycomb_dense_state') || '{}');
            } catch (err) {
                savedData = {};
            }

            let needsRender = true;
            let isAnimatingClear = false;
            let activeTool = 'sequence';

            const hexShape = new THREE.Shape();
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI) / 3;
                const x = HEX_SIZE * Math.sin(angle);
                const y = HEX_SIZE * Math.cos(angle);
                if (i === 0) hexShape.moveTo(x, y);
                else hexShape.lineTo(x, y);
            }
            hexShape.closePath();

            const baseGeo = new THREE.ExtrudeGeometry(hexShape, {
                depth: 0.7,
                bevelEnabled: true,
                bevelSegments: 1,
                steps: 1,
                bevelSize: 0.025,
                bevelThickness: 0.025
            });
            baseGeo.center();

            const getBaseMaterial = (dark) => new THREE.MeshStandardMaterial({
                color: dark ? 0x131822 : 0xd8e1ed,
                roughness: 0.35,
                metalness: dark ? 0.7 : 0.3
            });

            const getOutlineMaterial = (dark) => new THREE.LineBasicMaterial({ 
                color: dark ? 0x3a4859 : 0x6e809d 
            });

            let baseMat = getBaseMaterial(isDarkMode);
            let outlineMat = getOutlineMaterial(isDarkMode);

            // Android WebView Bridge function for instant theme switching
            window.setAppTheme = function(darkMode) {
                isDarkMode = darkMode;
                document.body.style.backgroundColor = isDarkMode ? "#080b10" : "#f2f5fa";
                scene.fog.color.setHex(isDarkMode ? 0x080b10 : 0xf2f5fa);
                ambientLight.intensity = isDarkMode ? 0.8 : 1.2;
                keyLight.intensity = isDarkMode ? 1.0 : 0.9;
                
                baseMat = getBaseMaterial(isDarkMode);
                outlineMat = getOutlineMaterial(isDarkMode);
                
                hexMeshes.forEach((item) => {
                    if (item.group && item.group.children[0]) {
                        item.group.children[0].material = baseMat;
                    }
                    if (item.group && item.group.children[1]) {
                        item.group.children[1].material = outlineMat;
                    }
                });
                needsRender = true;
            };

            function buildGrid(preserveData = true) {
                fallingDebris.forEach(d => {
                    if (d.mesh) scene.remove(d.mesh);
                });
                fallingDebris = [];
                isAnimatingClear = false;

                hexMeshes.forEach(item => scene.remove(item.mesh));
                hexMeshes.clear();
                raycastTargets = [];

                const vFOV = THREE.MathUtils.degToRad(camera.fov);
                const height = 2 * Math.tan(vFOV / 2) * camera.position.distanceTo(new THREE.Vector3(0,0,0));
                const width = height * camera.aspect;

                const xSpacing = HEX_WIDTH * 0.75;
                const ySpacing = HEX_HEIGHT;

                const cols = Math.ceil(width / xSpacing) + 5;
                const rows = Math.ceil(height / ySpacing) + 5;

                const startCol = -Math.floor(cols / 2);
                const endCol = Math.floor(cols / 2);
                const startRow = -Math.floor(rows / 2);
                const endRow = Math.floor(rows / 2);

                for (let q = startCol; q <= endCol; q++) {
                    for (let r = startRow; r <= endRow; r++) {
                        const x = q * xSpacing;
                        const y = r * ySpacing + (q & 1) * (ySpacing / 2);

                        const key = `${q},${r}`;
                        const savedState = savedData[key] || 0;

                        if (savedState !== 0 && neonColors[savedState] === null) {
                            delete savedData[key];
                        }

                        const group = createHexGroup(savedState, key);
                        group.position.set(x, y, 0);
                        scene.add(group);
                    }
                }
                
                if (preserveData) {
                    try {
                        localStorage.setItem('holo_honeycomb_dense_state', JSON.stringify(savedData));
                    } catch (e) {}
                }
                needsRender = true;
            }

            function createHexGroup(stateIndex, key) {
                const group = new THREE.Group();

                const tile = new THREE.Mesh(baseGeo, baseMat);
                tile.userData = { key };
                group.add(tile);
                raycastTargets.push(tile);

                const edgesGeo = new THREE.EdgesGeometry(baseGeo);
                const wire = new THREE.LineSegments(edgesGeo, outlineMat);
                group.add(wire);

                const isLit = (stateIndex > 0 && neonColors[stateIndex] !== null);
                const bulbMat = new THREE.MeshBasicMaterial({
                    color: isLit ? neonColors[stateIndex] : 0x000000,
                    transparent: true,
                    opacity: isLit ? 0.95 : 0.0
                });
                const bulbMesh = new THREE.Mesh(baseGeo, bulbMat);
                bulbMesh.position.z = 0.4;
                group.add(bulbMesh);

                hexMeshes.set(key, { group, tile, bulbMat, stateIndex });
                return group;
            }

            function updateHexState(key, newIndex) {
                const item = hexMeshes.get(key);
                if (!item) return;

                item.stateIndex = newIndex;
                const colorVal = neonColors[newIndex];
                
                if (colorVal !== null) {
                    item.bulbMat.color.setHex(colorVal);
                    item.bulbMat.opacity = 0.95;
                    item.bulbMat.transparent = true;
                    item.bulbMat.needsUpdate = true;
                    savedData[key] = newIndex;
                } else {
                    item.bulbMat.opacity = 0.0;
                    item.bulbMat.transparent = true;
                    item.bulbMat.needsUpdate = true;
                    delete savedData[key];
                }
                
                try {
                    localStorage.setItem('holo_honeycomb_dense_state', JSON.stringify(savedData));
                } catch (e) {}
                needsRender = true;
            }

            function eraseHexWithAnimation(key) {
                const item = hexMeshes.get(key);
                if (!item || item.stateIndex === 0 || neonColors[item.stateIndex] === null) return;

                const colorVal = neonColors[item.stateIndex];
                item.bulbMat.opacity = 0.0;
                item.bulbMat.transparent = true;
                item.bulbMat.needsUpdate = true;
                item.stateIndex = 0;
                delete savedData[key];
                try {
                    localStorage.setItem('holo_honeycomb_dense_state', JSON.stringify(savedData));
                } catch (e) {}

                const worldPos = new THREE.Vector3();
                item.group.getWorldPosition(worldPos);

                const debrisGeo = baseGeo.clone();
                const debrisMat = new THREE.MeshBasicMaterial({ color: colorVal });
                const debrisMesh = new THREE.Mesh(debrisGeo, debrisMat);
                debrisMesh.position.copy(worldPos);
                debrisMesh.position.z += 0.4;

                scene.add(debrisMesh);

                fallingDebris.push({
                    mesh: debrisMesh,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 5,
                        -Math.random() * 8 - 7,
                        (Math.random() - 0.5) * 4
                    ),
                    rotationSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 8,
                        (Math.random() - 0.5) * 8,
                        (Math.random() - 0.5) * 8
                    )
                });
                needsRender = true;
            }

            buildGrid();

            const colorBtn = document.getElementById('color-btn');
            const colorDropdown = document.getElementById('color-dropdown');

            colorBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                colorDropdown.style.display = colorDropdown.style.display === 'flex' ? 'none' : 'flex';
            });

            window.addEventListener('pointerdown', (e) => {
                if (!colorDropdown.contains(e.target) && e.target !== colorBtn) {
                    colorDropdown.style.display = 'none';
                }
            });

            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const mode = item.getAttribute('data-mode');
                    if (mode === 'sequence') {
                        activeTool = 'sequence';
                        document.getElementById('ui-overlay').innerText = "SEQUENCE MODE";
                    } else if (mode === 'eraser') {
                        activeTool = 'eraser';
                        document.getElementById('ui-overlay').innerText = "ERASER MODE";
                    } else {
                        activeTool = parseInt(item.getAttribute('data-index'));
                        const colorName = item.innerText.trim();
                        document.getElementById('ui-overlay').innerText = `PAINT: ${colorName.toUpperCase()}`;
                    }
                    colorDropdown.style.display = 'none';
                });
            });

            function clearBoardWithAnimation() {
                if (isAnimatingClear) return;
                
                const activeItems = [];

                hexMeshes.forEach((item, key) => {
                    if (item.stateIndex > 0 || item.bulbMat.opacity > 0.05) {
                        let col = neonColors[item.stateIndex] || item.bulbMat.color.getHex() || 0x00f0ff;
                        activeItems.push({ key, color: col, itemRef: item });
                    }
                });

                if (activeItems.length === 0) {
                    scene.traverse((child) => {
                        if (child.isMesh && child.position.z > 0.2 && child.material && child.material.opacity > 0.05) {
                            activeItems.push({ key: null, color: child.material.color.getHex(), meshRef: child });
                        }
                    });
                }

                if (activeItems.length === 0) return;

                isAnimatingClear = true;
                savedData = {};
                try {
                    localStorage.removeItem('holo_honeycomb_dense_state');
                } catch (e) {}

                hexMeshes.forEach((item) => {
                    item.stateIndex = 0;
                    if (item.bulbMat) {
                        item.bulbMat.opacity = 0.0;
                        item.bulbMat.transparent = true;
                        item.bulbMat.needsUpdate = true;
                    }
                });

                scene.traverse((child) => {
                    if (child.isMesh && child.position.z > 0.2 && child.material) {
                        child.material.opacity = 0.0;
                        child.material.transparent = true;
                        child.material.needsUpdate = true;
                    }
                });

                activeItems.forEach(entry => {
                    let worldPos = new THREE.Vector3();
                    if (entry.itemRef && entry.itemRef.group) {
                        entry.itemRef.group.getWorldPosition(worldPos);
                    } else if (entry.meshRef) {
                        entry.meshRef.getWorldPosition(worldPos);
                    }

                    const debrisGeo = baseGeo.clone();
                    const debrisMat = new THREE.MeshBasicMaterial({ color: entry.color });
                    const debrisMesh = new THREE.Mesh(debrisGeo, debrisMat);
                    debrisMesh.position.copy(worldPos);
                    debrisMesh.position.z += 0.4;

                    scene.add(debrisMesh);

                    fallingDebris.push({
                        mesh: debrisMesh,
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 5,
                            -Math.random() * 8 - 7,
                            (Math.random() - 0.5) * 4
                        ),
                        rotationSpeed: new THREE.Vector3(
                            (Math.random() - 0.5) * 8,
                            (Math.random() - 0.5) * 8,
                            (Math.random() - 0.5) * 8
                        )
                    });
                });

                needsRender = true;
            }

            document.getElementById('clear-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                colorDropdown.style.display = 'none';
                clearBoardWithAnimation();
            });

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let isDrawing = false;
            let lastPaintedKey = null;

            function processInteraction(clientX, clientY) {
                if (isAnimatingClear) return;

                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(raycastTargets, false);
                
                if (intersects.length > 0) {
                    const hitTile = intersects[0].object;
                    if (hitTile.userData && hitTile.userData.key) {
                        const key = hitTile.userData.key;
                        
                        if (key === lastPaintedKey) return;
                        lastPaintedKey = key;

                        const currentItem = hexMeshes.get(key);
                        if (currentItem) {
                            if (activeTool === 'eraser') {
                                eraseHexWithAnimation(key);
                            } else if (typeof activeTool === 'number') {
                                updateHexState(key, activeTool);
                            } else {
                                if (isDrawing) {
                                    const nextState = (neonColors[currentItem.stateIndex] === null) ? 1 : ((currentItem.stateIndex % (neonColors.length - 2)) + 1);
                                    updateHexState(key, nextState);
                                } else {
                                    const nextState = (currentItem.stateIndex + 1) % neonColors.length;
                                    updateHexState(key, nextState);
                                }
                            }
                        }
                    }
                }
            }

            window.addEventListener('pointerdown', (e) => {
                if (e.target.id === 'clear-btn' || e.target.id === 'color-btn' || colorDropdown.contains(e.target)) return;
                isDrawing = true;
                lastPaintedKey = null;
                processInteraction(e.clientX, e.clientY);
            }, { passive: true });

            window.addEventListener('pointermove', (e) => {
                if (!isDrawing) return;
                processInteraction(e.clientX, e.clientY);
            }, { passive: true });

            window.addEventListener('pointerup', () => {
                isDrawing = false;
                lastPaintedKey = null;
            }, { passive: true });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                buildGrid();
            });

            function animate() {
                requestAnimationFrame(animate);

                if (fallingDebris.length > 0) {
                    let activeCount = 0;
                    fallingDebris.forEach(d => {
                        if (!d.mesh) return;

                        d.velocity.y -= 12 * 0.016; 
                        d.mesh.position.addScaledVector(d.velocity, 0.016);
                        d.mesh.rotation.x += d.rotationSpeed.x * 0.016;
                        d.mesh.rotation.y += d.rotationSpeed.y * 0.016;
                        d.mesh.rotation.z += d.rotationSpeed.z * 0.016;

                        let vector = d.mesh.position.clone();
                        vector.project(camera);

                        if (vector.y > -1.1) {
                            activeCount++;
                        } else {
                            scene.remove(d.mesh);
                            d.mesh = null;
                        }
                    });

                    if (activeCount === 0) {
                        fallingDebris.forEach(d => { if (d.mesh) scene.remove(d.mesh); });
                        fallingDebris = [];
                        isAnimatingClear = false;
                    }
                    needsRender = true;
                }

                if (needsRender) {
                    renderer.render(scene, camera);
                    needsRender = false;
                }
            }
            animate();
        }
    </script>
</body>
</html>
